
name: Shiendstunn
version: 1.0.0
main: com.shiendstunn.ShiendstunnPlugin
api-version: '1.21'

commands:
  fgt:
    description: Wechselt zwischen Survival und Creative
    usage: /fgt
    permission: shiendstunn.fgt

  dwg:
    description: Schaltet den Bannschutz für einen Spieler um
    usage: /dwg <Spielername>
    permission: shiendstunn.dwg

permissions:
  shiendstunn.fgt:
    description: Erlaubt die Nutzung von /fgt
    default: true

  shiendstunn.dwg:
    description: Erlaubt die Nutzung von /dwg
    default: true
